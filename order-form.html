<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج الطلب - Pizzeria 7Vibes</title>
    <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Forum&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/order-form-style.css">
</head>
<body>
    <!-- Preloader -->
    <div class="preload" data-preload>
        <div class="circle"></div>
        <p class="text">7Vibes</p>
    </div>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo-container">
                <h1 class="logo-text">7Vibes</h1>
            </div>
            <h1>طلب جديد</h1>
            <p class="subtitle">أطلب الآن واستمتع بأشهى الأطباق</p>
            <div class="separator"></div>
        </header>

        <!-- Order Form -->
        <div class="form-container">
            <form id="orderForm" class="order-form">
                
                <!-- Customer Information Section -->
                <div class="form-section">
                    <h2 class="section-title">
                        <span class="icon">👤</span>
                        معلومات العميل
                    </h2>
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="customerName" class="form-label">
                                الاسم الكامل
                                <span class="required">*</span>
                            </label>
                            <input 
                                type="text" 
                                id="customerName" 
                                name="customerName" 
                                class="form-input" 
                                placeholder="أدخل الاسم الكامل"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="customerPhone" class="form-label">
                                رقم الهاتف
                                <span class="required">*</span>
                            </label>
                            <input 
                                type="tel" 
                                id="customerPhone" 
                                name="customerPhone" 
                                class="form-input" 
                                placeholder="0555-123-456"
                                required
                            >
                        </div>

                        <div class="form-group full-width">
                            <label for="customerAddress" class="form-label">
                                العنوان
                            </label>
                            <textarea 
                                id="customerAddress" 
                                name="customerAddress" 
                                class="form-textarea" 
                                rows="3"
                                placeholder="أدخل العنوان الكامل للتوصيل (اختياري)"
                            ></textarea>
                        </div>
                    </div>
                </div>

                <!-- Order Type Section -->
                <div class="form-section">
                    <h2 class="section-title">
                        <span class="icon">🚗</span>
                        نوع الطلب
                    </h2>
                    
                    <div class="radio-group">
                        <label class="radio-card">
                            <input type="radio" name="orderType" value="delivery" checked>
                            <span class="radio-content">
                                <span class="radio-icon">🛵</span>
                                <span class="radio-title">توصيل</span>
                                <span class="radio-desc">توصيل إلى باب المنزل</span>
                            </span>
                            <span class="radio-checkmark"></span>
                        </label>

                        <label class="radio-card">
                            <input type="radio" name="orderType" value="pickup">
                            <span class="radio-content">
                                <span class="radio-icon">🏪</span>
                                <span class="radio-title">استلام</span>
                                <span class="radio-desc">استلام من المطعم</span>
                            </span>
                            <span class="radio-checkmark"></span>
                        </label>
                    </div>
                </div>

                <!-- Menu Items Section -->
                <div class="form-section">
                    <h2 class="section-title">
                        <span class="icon">🍕</span>
                        اختر الأصناف
                    </h2>
                    
                    <div class="menu-items" id="menuItems">
                        <!-- Menu items will be dynamically inserted here -->
                    </div>

                    <button type="button" class="btn-add-item" onclick="addCustomItem()">
                        <span>➕</span>
                        إضافة صنف آخر
                    </button>
                </div>

                <!-- Special Instructions Section -->
                <div class="form-section">
                    <h2 class="section-title">
                        <span class="icon">📝</span>
                        ملاحظات خاصة
                    </h2>
                    
                    <div class="form-group">
                        <textarea 
                            id="specialInstructions" 
                            name="specialInstructions" 
                            class="form-textarea" 
                            rows="4"
                            placeholder="أضف أي ملاحظات خاصة بالطلب (اختياري)"
                        ></textarea>
                    </div>
                </div>

                <!-- Order Summary Section -->
                <div class="form-section">
                    <h2 class="section-title">
                        <span class="icon">💰</span>
                        ملخص الطلب
                    </h2>
                    
                    <div class="order-summary">
                        <div class="summary-items" id="summaryItems">
                            <div class="empty-summary">
                                <p>لم يتم اختيار أي أصناف بعد</p>
                            </div>
                        </div>
                        
                        <div class="summary-divider"></div>
                        
                        <div class="summary-row">
                            <span>المجموع الفرعي:</span>
                            <span id="subtotal">0 دج</span>
                        </div>
                        
                        <div class="summary-row">
                            <span>رسوم التوصيل:</span>
                            <span id="deliveryFee">200 دج</span>
                        </div>
                        
                        <div class="summary-divider"></div>
                        
                        <div class="summary-row total">
                            <span>الإجمالي:</span>
                            <span id="totalPrice">0 دج</span>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="form-actions">
                    <button type="submit" class="btn-submit">
                        <span class="btn-text">إرسال الطلب</span>
                        <span class="btn-icon">🚀</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="modal-icon">✅</div>
            <h2 class="modal-title">تم إرسال طلبك بنجاح!</h2>
            <p class="modal-text">سنتواصل معك قريباً لتأكيد الطلب</p>
            <p class="order-number">رقم الطلب: <span id="orderNumber">#0000</span></p>
            <button class="btn-modal" onclick="closeModal()">حسناً</button>
        </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="assets/js/order-form-api-script.js"></script>
</body>
</html>
